name: Daily JS/React/Next.js post

on:
  schedule:
    # 01:30 UTC = 07:00 (7 AM) IST, every day.
    # Note: GitHub runs scheduled workflows on a best-effort basis and can
    # start them late (sometimes hours) when Actions is under load.
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate today's carousel content + images
        id: generate
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          IMAGE_MODEL: ${{ secrets.IMAGE_MODEL }}
          # "ai" (default) = image model lays out whole slides; set this secret
          # to "procedural" to force the always-reliable PIL renderer instead.
          SLIDE_IMAGE_MODE: ${{ secrets.SLIDE_IMAGE_MODE }}
          # "on" (default) = let the image model redraw the mascot in a pose;
          # set this secret to "off" to always use assets/avatar.png as-is.
          AVATAR_POSE_MODE: ${{ secrets.AVATAR_POSE_MODE }}
        run: python generate.py > /tmp/generate_output.txt; status=$?; cat /tmp/generate_output.txt; exit $status

      - name: Extract image filenames
        id: filenames
        run: |
          FILES=$(grep '^IMAGE_FILENAMES=' /tmp/generate_output.txt | cut -d= -f2)
          echo "IMAGE_FILENAMES=$FILES" >> "$GITHUB_OUTPUT"
          echo "Generated files: $FILES"

      - name: Commit and push generated images
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          IFS=',' read -ra FILES <<< "${{ steps.filenames.outputs.IMAGE_FILENAMES }}"
          for f in "${FILES[@]}"; do
            git add "images/$f"
          done
          git add data/topic_history.json
          # newly generated mascot poses, so they're generated once and reused
          if [ -d assets/avatar_poses ]; then git add assets/avatar_poses; fi
          git commit -m "Daily carousel: ${{ steps.filenames.outputs.IMAGE_FILENAMES }}"
          git push
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image paths + raw URLs
        id: urls
        run: |
          IFS=',' read -ra FILES <<< "${{ steps.filenames.outputs.IMAGE_FILENAMES }}"
          SHA="${{ steps.commit.outputs.SHA }}"
          PATHS=""
          URLS=""
          for f in "${FILES[@]}"; do
            PATHS="${PATHS}images/${f},"
            URLS="${URLS}https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/images/${f},"
          done
          echo "IMAGE_PATHS=${PATHS%,}" >> "$GITHUB_OUTPUT"
          echo "RAW_IMAGE_URLS=${URLS%,}" >> "$GITHUB_OUTPUT"

      - name: Post to Telegram + Instagram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          # Optional: set both to also post to a Facebook Page
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_PATHS: ${{ steps.urls.outputs.IMAGE_PATHS }}
          RAW_IMAGE_URLS: ${{ steps.urls.outputs.RAW_IMAGE_URLS }}
          CAPTION_FILE_INSTAGRAM: build/caption_instagram.txt
          CAPTION_FILE_TELEGRAM: build/caption_telegram.txt
        run: python scripts/post.py

