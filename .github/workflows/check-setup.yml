name: Check setup (Telegram + Instagram diagnostics)

# Run this manually from the Actions tab once, to verify all secrets are
# correct and to find your real numeric Instagram Business Account ID.
# It does NOT post anything - it only reads/prints information to the logs.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List available Gemini models for this API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if 'models' not in data:
              print('ERROR response:', data)
          else:
              for m in data['models']:
                  if 'generateContent' in m.get('supportedGenerationMethods', []):
                      print(m['name'])
          "

      - name: List Gemini models that support IMAGE generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if 'models' not in data:
              print('ERROR response:', data)
          else:
              found = False
              for m in data['models']:
                  methods = m.get('supportedGenerationMethods', [])
                  modalities = m.get('outputTokenLimit'), m.get('supportedOutputModalities', [])
                  name = m['name']
                  if 'generateContent' in methods and ('image' in name.lower() or 'IMAGE' in m.get('supportedOutputModalities', [])):
                      print(name)
                      found = True
              if not found:
                  print('No image-generation-capable models found for this API key/account.')
                  print('The AI background feature (generate_daily_background in generate.py) will')
                  print('automatically fall back to the procedural gradient background in this case -')
                  print('this is expected and not an error.')
          "

      - name: Check Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          echo "== getMe (bot identity) =="
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | python3 -m json.tool
          echo "== getChat (does the bot see your channel?) =="
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat?chat_id=${TELEGRAM_CHAT}" | python3 -m json.tool

      - name: Check Instagram token + find numeric Business Account ID
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          echo "== Token debug (is it valid? what permissions?) =="
          curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=${IG_ACCESS_TOKEN}&access_token=${IG_ACCESS_TOKEN}" | python3 -m json.tool

          echo "== Pages you manage (page access tokens are REDACTED - this log is public on a public repo) =="
          curl -s "https://graph.facebook.com/v21.0/me/accounts?access_token=${IG_ACCESS_TOKEN}" > /tmp/pages.json
          python3 - <<'EOF'
          import json
          data = json.load(open("/tmp/pages.json"))
          for p in data.get("data", []):
              tok = p.get("access_token")
              print(f"Page: {p.get('name')}  id={p.get('id')}  page_token={'present (hidden)' if tok else 'MISSING'}")
          if "data" not in data:
              print("ERROR response:", json.dumps(data)[:400])
          EOF

          echo "== For each page: linked Instagram Business Account (this numeric id is what IG_BUSINESS_ID must be) =="
          python3 - <<'EOF'
          import json, subprocess, os
          pages = json.load(open("/tmp/pages.json")).get("data", [])
          token = os.environ["IG_ACCESS_TOKEN"]
          for p in pages:
              page_id = p["id"]
              out = subprocess.run(
                  ["curl", "-s", f"https://graph.facebook.com/v21.0/{page_id}?fields=name,instagram_business_account&access_token={token}"],
                  capture_output=True, text=True,
              ).stdout
              print(f"Page: {p.get('name')} ({page_id}) ->", out)
          EOF

          echo "== Facebook Page posting readiness =="
          echo "FB_PAGE_ID secret set:    ${FB_PAGE_ID:+yes}${FB_PAGE_ID:-NO (Facebook posting will be skipped)}"
          echo "FB_PAGE_TOKEN secret set: ${FB_PAGE_TOKEN:+yes}${FB_PAGE_TOKEN:-NO (Facebook posting will be skipped)}"
          if [ -n "$FB_PAGE_ID" ] && [ -n "$FB_PAGE_TOKEN" ]; then
            echo "-- checking the page token can publish (needs pages_manage_posts) --"
            curl -s "https://graph.facebook.com/v21.0/${FB_PAGE_ID}?fields=name&access_token=${FB_PAGE_TOKEN}" | python3 -m json.tool
            curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=${FB_PAGE_TOKEN}&access_token=${IG_ACCESS_TOKEN}" \
              | python3 -c "
          import json,sys
          d = json.load(sys.stdin).get('data', {})
          print('token type :', d.get('type'))
          print('page id    :', d.get('profile_id') or d.get('user_id'))
          print('expires_at :', d.get('expires_at'))
          print('scopes     :', ', '.join(d.get('scopes', [])))
          "
          fi
